name: divina_advmobprog
description: "A new Flutter project."
publish_to: 'none'
version: 0.3.0

environment:
  sdk: ^3.10.1

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  provider: ^6.0.5
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  flutter_screenutil: ^5.6.1
  shared_preferences: ^2.5.5
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
  assets:
    - assets/.env
    - assets/icons/
    - assets/images/
